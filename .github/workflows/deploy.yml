# Publishes the app to GitHub Pages on every push, so changes go live
# without anyone running a command. Enable once in the repository:
# Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [claude/crsc-sports-event-app-b3dwy8, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload the app
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
