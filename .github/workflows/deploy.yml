# Publishes the app to GitHub Pages on every push, so changes go live
# without anyone running a command. Enable once in the repository:
# Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [claude/crsc-sports-event-app-b3dwy8, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp this commit onto the scripts
        # Pages lets a browser cache js/ and css/, and a phone holds them
        # far longer than the header says. A fix nobody re-fetches is not a
        # fix — the duplicate rosters came back twice that way — so every
        # deploy gets its own URLs and nobody has to be told to hard-reload.
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s|src=\"js/app.js\"|src=\"js/app.js?v=$V\"|; s|href=\"css/styles.css\"|href=\"css/styles.css?v=$V\"|" public/index.html
          sed -i -E "s|(from '\./[a-zA-Z0-9_-]+\.js)'|\1?v=$V'|g" public/js/app.js
          # A sed that matches nothing exits 0, so say what must be true.
          grep -q "js/app.js?v=$V" public/index.html
          grep -q "css/styles.css?v=$V" public/index.html
          test "$(grep -c "\.js?v=$V'" public/js/app.js)" = 4
          echo "stamped $V"
      - name: Upload the app
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
